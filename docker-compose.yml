# Local development stack for VAR OS.
# Brings up everything the Core API needs (see docs/ARCHITECTURE.md §14):
# Postgres (+pgvector-ready image), Redis, and the API itself with live reload.
#
# Usage:
#   docker compose up --build
#   docker compose exec core-api alembic upgrade head

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: varos
      POSTGRES_PASSWORD: varos
      POSTGRES_DB: varos
    ports:
      - "5432:5432"
    volumes:
      - varos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      VAROS_DATABASE_URL: postgresql+asyncpg://varos:varos@postgres:5432/varos
      VAROS_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  varos_postgres_data:
